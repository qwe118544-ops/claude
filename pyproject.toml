[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyweather"
version = "0.1.0"
description = "Intraday probabilistic pricing engine for Polymarket daily-high-temperature markets (London EGLC / Amsterdam EHAM / Tokyo RJTT)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
polyweather = "polyweather.__main__:main"

[tool.setuptools.packages.find]
include = ["polyweather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
